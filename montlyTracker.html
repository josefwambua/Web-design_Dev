<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f4f8;
    }

    h2, h3 {
      text-align: center;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    label, input {
      margin: 5px 0;
    }

    input, button {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      max-width: 700px;
      margin: 20px auto;
    }

    .day {
      width: 100%;
      height: 100px;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      position: relative;
    }

    .day:hover {
      background-color: #f0f4f8;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      bottom: 10px;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      width: 250px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card p {
      margin: 0;
      color: #333;
    }

    .summary {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
      color: #333;
    }

    .error {
      color: red;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Transaction Reminder Calendar</h2>

  <div>
    <form id="transactionForm">
      <label for="date">Date:</label>
      <input type="date" id="date" required>
      <label for="description">Description:</label>
      <input type="text" id="description" placeholder="Enter description" required>
      <label for="amount">Amount:</label>
      <input type="number" id="amount" placeholder="Enter amount" required>
      <button type="button" onclick="addTransaction()">Add Transaction</button>
    </form>
  </div>

  <div class="calendar" id="calendar"></div>

  <h3>Transactions for Selected Day</h3>
  <div class="card-container" id="cards"></div>

  <script>
    // Data storage
    const transactions = [];

    // Add a new transaction
    function addTransaction() {
      const date = document.getElementById("date").value;
      const description = document.getElementById("description").value;
      const amount = document.getElementById("amount").value;

      if (date && description && amount && parseFloat(amount) > 0) {
        const newTransaction = { date, description, amount: parseFloat(amount) };
        transactions.push(newTransaction);

        // Update the calendar and clear the form
        renderCalendar();
        document.getElementById("transactionForm").reset();
      } else {
        alert("Please fill all fields with valid data!");
      }
    }

    // Render calendar for the current month
    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = ""; // Clear previous calendar

      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Fill blank spaces for days before the first day of the month
      for (let i = 0; i < firstDayOfMonth; i++) {
        const emptyDay = document.createElement("div");
        emptyDay.className = "day inactive";
        calendar.appendChild(emptyDay);
      }

      // Add days of the current month
      for (let day = 1; day <= daysInMonth; day++) {
        const dateString = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const dayElement = document.createElement("div");
        dayElement.className = "day";
        dayElement.innerText = day;

        // Highlight days with transactions
        if (transactions.some(t => t.date === dateString)) {
          const dot = document.createElement("div");
          dot.className = "dot"; // Visual indicator for transactions
          dayElement.appendChild(dot);

          // Enable clicking on days with transactions
          dayElement.onclick = () => displayTransactionsForDate(dateString);
        }

        calendar.appendChild(dayElement);
      }
    }

    // Display transactions for the selected day
    function displayTransactionsForDate(date) {
      const cardsContainer = document.getElementById("cards");
      cardsContainer.innerHTML = ""; // Clear previous cards

      const filteredTransactions = transactions.filter(t => t.date === date);

      filteredTransactions.forEach(transaction => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <p>Date: ${transaction.date}</p>
          <p>Description: ${transaction.description}</p>
          <p>Amount: $${transaction.amount.toFixed(2)}</p>
        `;
        cardsContainer.appendChild(card);
      });
    }

    // Render the calendar on page load
    renderCalendar();
  </script>
</body>
</html>
