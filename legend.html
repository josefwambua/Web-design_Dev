<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Garamond;
      margin: 0;
      padding: 20px;
      background-color: #f0f4f8;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    label, input {
      margin: 5px 0;
    }

    input, button {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      width: 250px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card p {
      margin: 0;
      color: #333;
    }

    .balance {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }

    .error {
      color: red;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Bank Transaction Tracker</h2>
  <div class="balance" id="balanceDisplay">Account Balance: $1000.00</div>
  <div class="error" id="errorDisplay"></div>

  <form id="transactionForm">
    <label for="description">Description:</label>
    <input type="text" id="description" placeholder="Enter description" required>
    <label for="amount">Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount" required>
    <button type="button" onclick="addTransaction()">Add Expense</button>
  </form>

  <div class="card-container" id="cards"></div>

  <script>
    // Parent class: Transaction
    class Transaction {
      constructor(description, amount) {
        this.description = description;
        this.amount = parseFloat(amount);
      }

      displayDetails() {
        return `Description: ${this.description}, Amount: $${this.amount.toFixed(2)}`;
      }
    }

    // Child class: Expense
    class Expense extends Transaction {
      constructor(description, amount) {
        super(description, amount); // Use parent class constructor
      }
    }

    // Account balance
    let accountBalance = 1000.0; // Initial balance
    const transactions = []; // Store all transactions

    // Function to add a transaction
    function addTransaction() {
      const description = document.getElementById("description").value;
      const amount = document.getElementById("amount").value;
      const errorDisplay = document.getElementById("errorDisplay");

      // Clear previous error messages
      errorDisplay.innerText = "";

      if (description && amount && parseFloat(amount) > 0) {
        const expenseAmount = parseFloat(amount);

        if (expenseAmount > accountBalance) {
          errorDisplay.innerText = "Error: Insufficient funds!";
        } else {
          // Deduct from balance and create a new Expense object
          accountBalance -= expenseAmount;
          const newExpense = new Expense(description, expenseAmount);

          // Add the transaction to the list and update the UI
          transactions.push(newExpense);
          displayTransactions();
          updateBalance();
        }
      } else {
        errorDisplay.innerText = "Error: Please fill all fields with valid data!";
      }
    }

    // Function to display transactions
    function displayTransactions() {
      const cardsContainer = document.getElementById("cards");
      cardsContainer.innerHTML = ""; // Clear existing cards

      transactions.forEach(transaction => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <p>Description: ${transaction.description}</p>
          <p>Amount: -$${transaction.amount.toFixed(2)}</p>
        `;
        cardsContainer.appendChild(card);
      });
    }

    // Function to update balance
    function updateBalance() {
      const balanceDisplay = document.getElementById("balanceDisplay");
      balanceDisplay.innerText = `Account Balance: $${accountBalance.toFixed(2)}`;
    }
  </script>
</body>
</html>
