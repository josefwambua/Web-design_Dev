<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
    }

    .dashboard {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .account-balance {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .balance-input-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .balance-input-form label, 
    .balance-input-form input, 
    .balance-input-form button {
      margin: 5px 0;
    }

    .balance-input-form input, 
    .balance-input-form button {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .balance-input-form button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    .balance-input-form button:hover {
      background-color: #0056b3;
    }

    .transaction-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .transaction-form label, 
    .transaction-form input, 
    .transaction-form button {
      margin: 5px 0;
    }

    .transaction-form input, 
    .transaction-form button {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .transaction-form button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    .transaction-form button:hover {
      background-color: #45a049;
    }

    .summary {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .day {
      width: 100%;
      height: 100px;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .day:hover {
      background-color: #f0f4f8;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      bottom: 10px;
    }

    .recent-transactions {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .recent-transactions h3 {
      margin-top: 0;
    }

    .recent-transactions p {
      margin: 0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>Transaction Dashboard</h2>

    <!-- Account Balance Input -->
    <div class="balance-input-form">
      <label for="initialBalance">Enter Initial Account Balance:</label>
      <input type="number" id="initialBalance" placeholder="Enter starting balance" required>
      <button type="button" onclick="setInitialBalance()">Set Balance</button>
    </div>

    <!-- Account Balance -->
    <div class="dashboard-header">
      <div class="account-balance" id="balanceDisplay">Account Balance: $0.00</div>
      <div class="summary" id="monthlyExpenses">Monthly Expenses: $0.00</div>
    </div>

    <!-- Transaction Form -->
    <div class="transaction-form">
      <form id="transactionForm">
        <label for="date">Date:</label>
        <input type="date" id="date" required>
        <label for="description">Description:</label>
        <input type="text" id="description" placeholder="Enter description" required>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount" required>
        <button type="button" onclick="addTransaction()">Add Transaction</button>
      </form>
    </div>

    <!-- Calendar -->
    <div class="calendar" id="calendar"></div>

    <!-- Recent Transactions -->
    <div class="recent-transactions">
      <h3>Recent Transactions</h3>
      <div id="recentTransactions"></div>
    </div>
  </div>

  <script>
    let accountBalance = 0;
    const transactions = [];

    // Set initial account balance
    function setInitialBalance() {
      const initialBalance = document.getElementById("initialBalance").value;

      if (initialBalance && parseFloat(initialBalance) > 0) {
        accountBalance = parseFloat(initialBalance);
        updateBalance();
        alert("Account balance set successfully!");
      } else {
        alert("Please enter a valid starting balance!");
      }
    }

    // Add transaction
    function addTransaction() {
      const date = document.getElementById("date").value;
      const description = document.getElementById("description").value;
      const amount = document.getElementById("amount").value;

      if (date && description && amount && parseFloat(amount) > 0) {
        const expenseAmount = parseFloat(amount);

        // Check for sufficient balance
        if (expenseAmount > accountBalance) {
          alert("Error: Insufficient funds!");
        } else {
          accountBalance -= expenseAmount;
          transactions.push({ date, description, amount: expenseAmount });
          updateBalance();
          calculateMonthlyExpenses();
          renderRecentTransactions();
          renderCalendar();
          document.getElementById("transactionForm").reset();
        }
      } else {
        alert("Please fill all fields with valid data!");
      }
    }

    // Update balance display
    function updateBalance() {
      document.getElementById("balanceDisplay").innerText = `Account Balance: $${accountBalance.toFixed(2)}`;
    }

    // Calculate monthly expenses
    function calculateMonthlyExpenses() {
      const currentMonth = new Date().getMonth();
      const monthlyTotal = transactions
        .filter(t => new Date(t.date).getMonth() === currentMonth)
        .reduce((sum, t) => sum + t.amount, 0);

      document.getElementById("monthlyExpenses").innerText = `Monthly Expenses: $${monthlyTotal.toFixed(2)}`;
    }

    // Render recent transactions
    function renderRecentTransactions() {
      const recentTransactions = document.getElementById("recentTransactions");
      recentTransactions.innerHTML = "";

      transactions.slice(-5).forEach(t => {
        const transactionElement = document.createElement("p");
        transactionElement.innerText = `${t.date}: ${t.description} - $${t.amount.toFixed(2)}`;
        recentTransactions.appendChild(transactionElement);
      });
    }

    // Render calendar
    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Fill blank spaces for days before

            // Fill blank spaces for days before the first day of the month
            for (let i = 0; i < firstDayOfMonth; i++) {
        const emptyDay = document.createElement("div");
        emptyDay.className = "day inactive";
        calendar.appendChild(emptyDay);
      }

      // Add days of the current month
      for (let day = 1; day <= daysInMonth; day++) {
        const dateString = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const dayElement = document.createElement("div");
        dayElement.className = "day";
        dayElement.innerText = day;

        // Highlight days with transactions
        if (transactions.some(t => t.date === dateString)) {
          const dot = document.createElement("div");
          dot.className = "dot"; // Visual indicator for transactions
          dayElement.appendChild(dot);

          // Enable clicking on days with transactions
          dayElement.onclick = () => displayTransactionsForDate(dateString);
        }

        calendar.appendChild(dayElement);
      }
    }

    // Display transactions for a selected day
    function displayTransactionsForDate(date) {
      const recentTransactions = document.getElementById("recentTransactions");
      recentTransactions.innerHTML = ""; // Clear previous transactions

      const filteredTransactions = transactions.filter(t => t.date === date);

      if (filteredTransactions.length === 0) {
        const noTransactionsMessage = document.createElement("p");
        noTransactionsMessage.innerText = "No transactions for this day.";
        recentTransactions.appendChild(noTransactionsMessage);
      } else {
        filteredTransactions.forEach(transaction => {
          const transactionElement = document.createElement("p");
          transactionElement.innerText = `${transaction.date}: ${transaction.description} - $${transaction.amount.toFixed(2)}`;
          recentTransactions.appendChild(transactionElement);
        });
      }
    }

    // Render the calendar on page load
    renderCalendar();
  </script>
</body>
</html>
